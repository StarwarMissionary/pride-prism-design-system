# Merge this snippet into ~/.codex/config.toml.

[desktop]
appearanceTheme = "dark"
appearanceLightCodeThemeId = "catppuccin"
appearanceDarkCodeThemeId = "dracula"

[desktop.appearanceLightChromeTheme]
accent = "#750787"
contrast = 78
ink = "#2B0033"
opaqueWindows = false
surface = "#FFF4FA"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#008026"
diffRemoved = "#E40303"
skill = "#FF8C00"

[desktop.appearanceDarkChromeTheme]
accent = "#FF4FD8"
contrast = 86
ink = "#FFF9F2"
opaqueWindows = false
surface = "#140021"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#00B85C"
diffRemoved = "#FF3B3B"
skill = "#FFED00"
