name: Validate foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared tokens
        run: node scripts/test-theme.mjs
      - name: Validate adapter boundaries
        run: node scripts/test-adapters.mjs
      - name: Validate Blender preservation guards
        run: python -B -m unittest discover -s adapters/blender -p 'test_*.py'
      - name: Validate Windows preference mapping without registry access
        shell: powershell
        run: ./scripts/test-windows.ps1
      - name: Verify reproducible Pages assets
        run: |
          node scripts/build-site.mjs
          git diff --exit-code -- docs/theme
